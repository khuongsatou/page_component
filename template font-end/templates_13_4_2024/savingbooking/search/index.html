<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Search Form</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="search-container">
    <div class="search-input">
      <label for="destination">Bạn muốn đi đâu ?</label>
      <input type="text" id="destination" placeholder="Thành phố, khách sạn, điểm đến">
    </div>
    <div class="search-dates">
      <div class="date">
        <label for="checkin">Ngày đến</label>
        <input type="text" id="checkin" value="06/09/2024" readonly>
      </div>
      <div class="date">
        <label for="checkout">Ngày về</label>
        <input type="text" id="checkout" value="07/09/2024" readonly>
      </div>
    </div>
    <div class="search-guests">
      <label for="guests">Số phòng, số khách</label>
      <input type="text" id="guests" value="1 Phòng, 2 Người lớn, 0 Trẻ em" readonly>
    </div>
    <div class="search-btn">
      <button><i class="fas fa-search"></i></button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
