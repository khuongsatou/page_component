<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tour Information</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <div class="card" id="itinerary">
            <i class="fa-solid fa-clock"></i>
            <div class="text">
                <p>Hành trình</p>
                <p><strong>5 ngày 6 đêm</strong></p>
            </div>
        </div>
        <div class="card" id="tour-type">
            <i class="fa-solid fa-flag"></i>
            <div class="text">
                <p>Thể loại du lịch</p>
                <p><strong>Trekking Tour</strong></p>
            </div>
        </div>
        <div class="card" id="group-size">
            <i class="fa-solid fa-users"></i>
            <div class="text">
                <p>Nhóm tour</p>
                <p><strong>25 người</strong></p>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
