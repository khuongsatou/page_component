<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Property Types</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

      <img src="https://via.placeholder.com/250" alt="Căn hộ">

    <div class="property-item">
      <img src="https://via.placeholder.com/250" alt="Resort">

    <div class="property-item">
      <img src="https://via.placeholder.com/250" alt="Villa">
      <div class="property-text">Villa</div>

    <div class="property-item">
      <img src="https://via.placeholder.com/250" alt="Nhà nghỉ">
      <div class="property-text">Nhà nghỉ</div>

    <div class="property-item">
      <img src="https://via.placeholder.com/250" alt="Khách sạn">

</html>
