<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visa Offers</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://kit.fontawesome.com/yourkitcode.js"></script> <!-- Replace 'yourkitcode' with your actual Font Awesome kit code -->
</head>
<body>
    <div class="container">
        <!-- Example card for Visa Offer -->
        <div class="card">
            <img src="img-1.png" alt="Destination" class="card-image">
            <div class="card-content">
                <h1 class="country-name">Dubai</h1>
                <p class="visa-type">VISA Dubai</p>
                <div class="rating">
                    <span class="fas fa-star checked"></span>
                    <span class="fas fa-star checked"></span>
                    <span class="fas fa-star checked"></span>
                    <span class="fas fa-star checked"></span>
                    <span class="fas fa-star"></span>
                    <span class="review-count">(2 reviews) | 20k đã đặt</span>
                </div>
                <p class="visa-detail"><strong>Loại visa:</strong> Visa du lịch</p>
                <p class="duration"><strong>Thời gian:</strong> 3 ngày</p>
                <p class="discount"><strong>Tiết kiệm:</strong> 0%</p>
                <div class="price"><span class="new-price">$150.00</span></div>
                <button class="btn">Đặt ngay</button>
            </div>
        </div>
        <!-- Repeat for other cards -->
    </div>

    <script src="script.js"></script>
</body>
</html>
