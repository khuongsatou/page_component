<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Nhập</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <div class="login-header">
                <!-- <img src="https://via.placeholder.com/150x50?text=VIET+TOURIST+PHOENIX" alt="Logo" class="logo"> -->
                <img src="logo.png" alt="Logo" class="logo">
                <h2>Đăng Nhập</h2>
            </div>
            <form>
                <div class="input-group">
                    <i class="fas fa-user left"></i>
                    <input type="text" placeholder="Tài Khoản" required>
                </div>
                <div class="input-group">
                    <i class="fas fa-lock left"></i>
                    <input type="password" placeholder="Mật Khẩu" required>
                    <i class="fas fa-eye toggle-password"></i>
                </div>
                <div class="remember-forgot">
                    <label>
                        <input type="checkbox"> Duy trì đăng nhập
                    </label>
                    <a href="#">Quên mật khẩu?</a>
                </div>
                <button type="submit" class="btn-login">Đăng Nhập</button>
            </form>
            <div class="create-account">
                <a href="#">Tạo Tài Khoản</a>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
