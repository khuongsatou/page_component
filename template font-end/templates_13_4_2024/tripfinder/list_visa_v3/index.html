<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Visa Options</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="container">
  <!-- Example Card for India -->
  <div class="card">
    <img src="img-1.png" alt="India">
    <div class="info">
      <h3>India</h3>
      <div class="meta">
        <span>
            <i class="fas fa-star"></i> 5 (20k booked)
        </span>
       
        <span class="visa-type"><i class="fas fa-suitcase"></i> eVisa</span>
      </div>
      <div class="details">
        <span class="duration"><i class="fas fa-clock"></i> 3 days</span>
        <span class="price">$50.00</span>
      </div>
      <button>Book Now</button>
    </div>
  </div>
</div>
<script src="scripts.js"></script>
</body>
</html>
