<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Interface</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            background-color: #f5f7fb;
            margin: 0;
            padding: 0;
        }
        .container {
            text-align: center;
            padding: 40px;
        }
        .header {
            font-size: 36px;
            color: #2d6cdf;
            margin-bottom: 10px;
        }
        .sub-header {
            font-size: 18px;
            color: #666;
            margin-bottom: 40px;
        }
        .tab-container {
            display: flex;
            justify-content: center;
            margin-bottom: 40px;
        }
        .tab {
            padding: 10px 20px;
            border-radius: 20px;
            margin: 0 10px;
            cursor: pointer;
            transition: background-color 0.3s, color 0.3s;
        }
        .tab.active {
            background: linear-gradient(90deg, rgba(60,93,230,1) 0%, rgba(110,60,230,1) 100%);
            color: white;
        }
        .tab.inactive {
            color: #2d6cdf;
        }
        .project-display {
            display: flex;
            justify-content: center;
            animation: fadeIn 0.5s ease-in-out;
        }
        .project-image {
            width: 60%;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">Dự án</div>
        <div class="sub-header">Phía dưới là một số dự án tôi hoàn thành. Mỗi dự án thể hiện sự cống hiến và nỗ lực của tôi, cùng với tinh thần làm việc sáng tạo.</div>
        <div class="tab-container">
            <div class="tab active" id="personal-tab">Cá nhân</div>
            <div class="tab inactive" id="real-tab">Thực tế</div>
            <div class="tab inactive" id="development-tab">Phát triển</div>
        </div>
        <div class="project-display">
            <img src="image-2.jpg" alt="Project" class="project-image">
        </div>
    </div>

    <script>
        document.getElementById('personal-tab').addEventListener('click', function() {
            activateTab('personal-tab');
        });
        document.getElementById('real-tab').addEventListener('click', function() {
            activateTab('real-tab');
        });
        document.getElementById('development-tab').addEventListener('click', function() {
            activateTab('development-tab');
        });

        function activateTab(tabId) {
            document.querySelectorAll('.tab').forEach(function(tab) {
                tab.classList.remove('active');
                tab.classList.add('inactive');
            });
            document.getElementById(tabId).classList.add('active');
            document.getElementById(tabId).classList.remove('inactive');
            // Change the project image or content as needed
        }
    </script>
</body>
</html>
