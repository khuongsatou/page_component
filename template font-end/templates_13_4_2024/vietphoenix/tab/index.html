<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabbed Navigation</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <div class="tab-container">
        <div class="tab active" id="overview">
            <i class="fas fa-info-circle"></i> Tổng Quan
        </div>
        <div class="tab" id="journey">
            <i class="fas fa-road"></i> Hành Trình
        </div>
        <div class="tab" id="includes">
            <i class="fas fa-list"></i> Bao gồm
        </div>
        <div class="tab" id="reviews">
            <i class="fas fa-star"></i> Đánh Giá
        </div>
    </div>
</body>
</html>
