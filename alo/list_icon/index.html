<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Financial Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="dashboard">
        <div class="carousel">
            <div class="item">
                <div class="icon"><i class="fas fa-arrow-down"></i></div>
                <div class="content">
                    <div class="title">USD/JPY</div>
                    <div class="value">152.8 <span class="change negative">-0.56%</span></div>
                </div>
            </div>
            <div class="item">
                <div class="icon"><i class="fas fa-arrow-down"></i></div>
                <div class="content">
                    <div class="title">BITCOIN USD</div>
                    <div class="value">64290.63 <span class="change negative">-2.15%</span></div>
                </div>
            </div>
            <div class="item">
                <div class="icon"><i class="fas fa-arrow-down"></i></div>
                <div class="content">
                    <div class="title">CMC CRYPTO</div>
                    <div class="value">1311.252 <span class="change negative">-4.00%</span></div>
                </div>
            </div>
            <div class="item">
                <div class="icon"><i class="fas fa-arrow-down"></i></div>
                <div class="content">
                    <div class="title">FTSE 100</div>
                    <div class="value">8153.69 <span class="change negative">-0.17%</span></div>
                </div>
            </div>
            <div class="item">
                <div class="icon"><i class="fas fa-arrow-down"></i></div>
                <div class="content">
                    <div class="title">NIKKEI</div>
                    <div class="value">37988.27 <span class="change negative">-2.98%</span></div>
                </div>
            </div>
        </div>
        <div class="navigation">
            <i class="fas fa-chevron-left prev"></i>
            <i class="fas fa-chevron-right next"></i>
        </div>
    </div>

    <script src="scripts.js"></script>
</body>
</html>
