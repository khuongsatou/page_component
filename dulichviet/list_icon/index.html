<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travel Options</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="option" id="domestic">
            <i class="fas fa-search-location"></i>
            <span>Du lịch <strong>TRONG NƯỚC</strong></span>
        </div>
        <div class="option" id="international">
            <i class="fas fa-search-location"></i>
            <span>Du lịch <strong>NƯỚC NGOÀI</strong></span>
        </div>
        <div class="option" id="flights">
            <i class="fas fa-plane"></i>
            <span>Tìm <strong>VÉ MÁY BAY GIÁ RẺ</strong></span>
        </div>
        <div class="option" id="hotels">
            <i class="fas fa-hotel"></i>
            <span>Đặt <strong>KHÁCH SẠN TOÀN CẦU</strong></span>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
